# Version updates once a month, grouped, and the commit conventions of release-please. The commit-message settings also
# apply to the security updates, which stay one pull request per alert and skip the cooldown. Merge in squash: the
# pull request title becomes the commit.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    # a compromised release is usually unpublished within hours: wait a week before proposing it
    cooldown:
      default-days: 7
    # fix(deps): a production dependency reaches production through a release; chore(deps-dev): releases nothing
    commit-message:
      prefix: fix
      prefix-development: chore
      include: scope
    # The @angular/* packages move together, production and development ones alike (@angular/compiler-cli requires
    # the exact version of @angular/compiler): split by dependency type, their pull requests failed npm ci (ERESOLVE).
    # The order of the groups does not settle it: Dependabot puts a dependency in the group it deems the most specific,
    # and a dependency-type group beat the angular one. Hence the exclusion from the other groups, then one pull request
    # per dependency type, each with a single prefix
    groups:
      angular:
        patterns: ['@angular/*']
        update-types: [minor, patch]
      production:
        dependency-type: production
        exclude-patterns: ['@angular/*']
        update-types: [minor, patch]
      development:
        dependency-type: development
        exclude-patterns: ['@angular/*']
        update-types: [minor, patch]
    # the Angular majors go through ng update and its migrations, and Angular 22 pins its peers
    # (typescript >=6.0 <6.1, zone.js ~0.15 || ~0.16). @types/node follows Node 24 (.nvmrc)
    ignore:
      - dependency-name: '@angular/*'
        update-types: ['version-update:semver-major']
      - dependency-name: angular-eslint
        update-types: ['version-update:semver-major']
      - dependency-name: typescript
        update-types: ['version-update:semver-major', 'version-update:semver-minor']
      - dependency-name: zone.js
        update-types: ['version-update:semver-major', 'version-update:semver-minor']
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']

  # the actions are pinned by SHA: Dependabot updates the SHA and its # vX.Y.Z comment
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    commit-message:
      prefix: ci
      include: scope
    groups:
      actions:
        patterns: ['*']
