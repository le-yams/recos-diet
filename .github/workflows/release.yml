name: Release

# Delivery of master, with release-please (configuration and manifest in .release/). Every push is verified, deployed to
# staging, and updates the release pull request (package.json version, CHANGELOG.md) that release-please keeps open
# while commits call for a release (feat, fix, perf). Merging that pull request publishes the release (tag x.y.z,
# GitHub release) and deploys production: it is the approval. Only a release reaches production, so a data edit is a
# fix(data): commit.
# The release pull request is created with the GITHUB_TOKEN: no workflow runs on it and its required checks never
# report, so it is merged bypassing the ruleset. Its code is master's, verified by the run of its last commit.
# The build carries the version to come on staging, 2.4.0-rc.12+a1b2c3d (2.3.1+a1b2c3d when no release is due), and the
# released version, without suffix, on the push that publishes it: that same build then goes to production.
# Run workflow (workflow_dispatch) starts a run on the current master, without deploying production: to deploy a
# release again, re-run the jobs of its run.
# No workflow-level concurrency: each deploy job locks its environment.
on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-please:
    name: Release please
    # dispatched from another branch: skipped, and every job after it. The production environment also only accepts
    # master
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    permissions:
      # release pull request branch, tag and GitHub release
      contents: write
      # labels of the release pull request
      issues: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      version: ${{ steps.version.outputs.version }}
    steps:
      # opens or updates the release pull request, or publishes the release when this push merged it
      - name: Update the release pull request, or release
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: .release/release-please-config.json
          manifest-file: .release/release-please-manifest.json
      # 2.4.0-rc.12+a1b2c3d: the version of the open release pull request (labelled `autorelease: pending`), the number
      # of commits since the last release and this commit. 2.3.1+a1b2c3d when no release is due (chore, docs...), the
      # manifest version and this commit. 2.4.0 on the push that publishes it
      - name: Get the version to build
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_CREATED: ${{ steps.release.outputs.release_created }}
          RELEASED_VERSION: ${{ steps.release.outputs.version }}
        run: |
          manifest_version() {
            gh api "repos/$GITHUB_REPOSITORY/contents/.release/release-please-manifest.json?ref=$1" \
              -H 'Accept: application/vnd.github.raw' | jq -r '."."'
          }
          if [ "$RELEASE_CREATED" = true ]; then
            version=$RELEASED_VERSION
          else
            current=$(manifest_version "$GITHUB_SHA")
            release_branch=$(gh pr list --repo "$GITHUB_REPOSITORY" --state open --label 'autorelease: pending' \
              --json headRefName --jq '.[0].headRefName // empty')
            if [ -n "$release_branch" ]; then
              commits=$(gh api "repos/$GITHUB_REPOSITORY/compare/$current...$GITHUB_SHA" --jq .ahead_by)
              version="$(manifest_version "$release_branch")-rc.$commits+${GITHUB_SHA::7}"
            else
              version="$current+${GITHUB_SHA::7}"
            fi
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Version: $version" >> "$GITHUB_STEP_SUMMARY"

  verify:
    name: Verify
    needs: release-please
    uses: ./.github/workflows/verify.yml
    with:
      version: ${{ needs.release-please.outputs.version }}

  deploy-staging:
    name: Staging
    needs: verify
    uses: ./.github/workflows/deploy.yml
    with:
      environment: staging
      artifact: web
    secrets: inherit

  # the build deployed to staging, which carries the released version on the push that publishes the release
  deploy-production:
    name: Production
    needs: [release-please, deploy-staging]
    if: needs.release-please.outputs.release_created == 'true'
    uses: ./.github/workflows/deploy.yml
    with:
      environment: production
      artifact: web
      backup: true
    secrets: inherit
