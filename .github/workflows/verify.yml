name: Verify

# Lint, build (initial budget included), tests and audit of every pull request. On master, the release workflow
# calls it with the version to build and deploys its build to staging, then to production when the push publishes a
# release.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_call:
    inputs:
      version:
        description: Version to build, in place of the package.json one (2.4.0-rc.12+a1b2c3d, or 2.4.0 for a release)
        type: string
        default: ''

concurrency:
  # pull requests: a new push cancels the checks of the previous one. Called by the release workflow: one group per
  # run, every master commit is verified
  group: verify-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # one step per project: GitHub shows at most 10 warning annotations per step and drops the others silently
      - name: Lint domain
        run: npx ng lint domain
      - name: Lint web
        if: ${{ !cancelled() }}
        run: npx ng lint web

  build-test:
    name: Build and test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # build of the release workflow (the staging version, or the released one); pull requests build the package.json
      # version. Only package.json of the runner changes: environment.prod.ts and version.json read it at build time.
      # Not `npm version`, which drops the +<commit> build metadata
      - name: Set the version to build
        if: inputs.version
        run: npm pkg set version="$VERSION"
        env:
          VERSION: ${{ inputs.version }}
      # prebuild writes version.json; fails when the initial bundle exceeds its budget (angular.json)
      - name: Build
        run: npm run build
      # Vitest in jsdom. The JUnit and Cobertura reports land in reports/<project> (vitest-base.config.mts of each
      # project); github-actions annotates the failed tests
      - name: Test domain
        run: npx ng test domain --no-watch --no-progress --coverage --reporters=default --reporters=junit --reporters=github-actions
      - name: Test web
        run: npx ng test web --no-watch --no-progress --coverage --reporters=default --reporters=junit --reporters=github-actions
      # one Coveralls build for both projects: comment and status on pull requests, master builds serve as the base of
      # the comparison. Authenticated by the GITHUB_TOKEN, no secret. Never blocking: a Coveralls outage must not hold
      # back a release, such as a clinical data fix
      - name: Report coverage
        uses: coverallsapp/github-action@8d6379e14d29928660c4ba802d8e85393440b329 # v2.3.8
        with:
          files: reports/domain/ng-coverage-domain.cobertura.xml reports/web/ng-coverage-web.cobertura.xml
          format: cobertura
          # the binary the action downloads, latest by default
          coverage-reporter-version: v0.6.22
          fail-on-error: false
      - name: Keep the build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web
          path: dist/web
          # .htaccess (SPA rewrite) is a hidden file
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
      - name: Keep the test reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-reports
          path: reports
          retention-days: 7

  audit:
    name: Audit production dependencies
    runs-on: ubuntu-24.04
    # blocking on ready pull requests only: elsewhere (drafts, master) a newly published advisory is a warning, so it
    # never blocks an urgent release such as a clinical data fix
    continue-on-error: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - run: npm audit --omit=dev --audit-level=high
