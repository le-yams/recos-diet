name: Verify

# Lint, build (initial budget included), tests and audit of every pull request. On master, the release workflow
# calls it first and deploys its build to staging.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_call:

concurrency:
  # pull requests: a new push cancels the checks of the previous one. Called by the release workflow: one group per
  # run, every master commit is verified
  group: verify-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx ng lint

  build-test:
    name: Build and test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # prebuild writes version.json; fails when the initial bundle exceeds its budget (angular.json)
      - name: Build
        run: npm run build
      - name: Test domain
        run: npx ng test domain --no-watch --no-progress --code-coverage --browsers=ChromeHeadless --reporters=progress,junit
      - name: Test web
        run: npx ng test web --no-watch --no-progress --code-coverage --browsers=ChromeHeadless --reporters=progress,junit
      - name: Keep the build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web
          path: dist/web
          # .htaccess (SPA rewrite) is a hidden file
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
      - name: Keep the test reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-reports
          path: reports
          retention-days: 7

  audit:
    name: Audit production dependencies
    runs-on: ubuntu-24.04
    # blocking on ready pull requests only: elsewhere (drafts, master) a newly published advisory is a warning, so it
    # never blocks an urgent release such as a clinical data fix
    continue-on-error: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - run: npm audit --omit=dev --audit-level=high
