<div class="container-fluid mt-3" *ngIf="(survey$ | async) || noSurvey; let survey">
  <div class="survey" *ngIf="survey.enabled">
    <iframe [src]="domSanitizer.bypassSecurityTrustResourceUrl(survey.url)">
      Loading…
    </iframe>
  </div>
  <div class="survey" *ngIf="!survey.enabled">
    <p>No survey in progress</p>
  </div>
</div>
