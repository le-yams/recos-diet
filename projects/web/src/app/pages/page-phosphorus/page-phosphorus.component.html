<mat-card>
  <mat-card-title>
    <fa-icon [icon]="faStickyNote" aria-hidden="true"></fa-icon>&nbsp;Suppl&eacute;mentation en phosphore
  </mat-card-title>


  <mat-card-content>

    <mat-card class="my-4">
      <mat-card-subtitle>
        Phosphorémie à 0,33 mmol/L et/ou signes cliniques de SRI
      </mat-card-subtitle>
      <mat-card-content>
        <ul>
          <li>IV: 0,66 mmol/kg/24h</li>
        </ul>
      </mat-card-content>
    </mat-card>

    <mat-card class="my-4">
      <mat-card-subtitle>
        Phosphorémie entre 0,33 et 0,66 mmol/L
      </mat-card-subtitle>
      <mat-card-content>
        <ul>
          <li>IV: 0,33 mmol/kg/24h</li>
        </ul>
      </mat-card-content>
    </mat-card>

    <mat-card class="my-4">
      <mat-card-subtitle>
        Phosphorémie entre 0,66 et 0,8 mmol/L
      </mat-card-subtitle>
      <mat-card-content>
        <ul>
          <li>PO: 0,33 mmol/kg/24h</li>
          <li>IV: 0,16 mmol/kg/24h</li>
        </ul>
      </mat-card-content>
    </mat-card>

  </mat-card-content>
</mat-card>
