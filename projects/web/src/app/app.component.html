<app-disclaimer></app-disclaimer>

<div class="shell">

  @if ((isHandset$ | async) && !drawer.opened) {
    <div id="flyingMenu">
      <button mat-button color="primary" type="button" aria-label="Toggle sidenav" (click)="drawer.toggle()"
              onclick="this.blur()">
        <fa-icon [icon]="faBars" aria-hidden="true"></fa-icon>&nbsp;<span>Menu</span>
      </button>
    </div>
  }

  <mat-sidenav-container>
    <mat-sidenav #drawer
                 [mode]="(isHandset$ | async) ? 'over' : 'side'"
                 [opened]="(isHandset$ | async) === false">

      @if ((isHandset$ | async)) {
        <button mat-icon-button color="primary" type="button" aria-label="Toggle sidenav"
                (click)="drawer.toggle()" onclick="this.blur()">
          <fa-icon [icon]="faBars" aria-hidden="true"></fa-icon>
        </button>
      }

      <mat-nav-list>
        @for (menu of menus; track menu) {
          <mat-list-item [routerLink]="[menu.route]" (click)="closeDrawerIfHandset(drawer)">
            <a mat-button color="primary" [class.mat-flat-button]="isSelected(menu)">
              <fa-icon [icon]="menu.icon" aria-hidden="true"></fa-icon>&nbsp;{{menu.label}}
            </a>
          </mat-list-item>
        }
      </mat-nav-list>
    </mat-sidenav>
    <mat-sidenav-content>
      @if ((survey$ | async) || noSurvey; as survey) {
        @if (survey.enabled && currentRoute() !== '/survey') {
          <div style="display: flex; justify-content: center">
            <button mat-flat-button color="accent" class="m-2 blinking text-center" routerLink="/survey">
              Donnez votre avis ici !
            </button>
          </div>
        }
      }
      <div class="main-content">
        <router-outlet></router-outlet>
      </div>
    </mat-sidenav-content>
  </mat-sidenav-container>
</div>
<app-footer></app-footer>
