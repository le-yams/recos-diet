<mat-expansion-panel expanded="true">
  <mat-expansion-panel-header>
    <mat-panel-title>
      <fa-icon [icon]="faUserInjured" aria-hidden="true"></fa-icon>&nbsp;Patient
    </mat-panel-title>
    <mat-panel-description>
      {{patient.heightCm.toFixed(0)}}cm/{{patient.weightKg.toFixed(0)}}kg
    </mat-panel-description>
  </mat-expansion-panel-header>

  <form>
    <p>
      <mat-form-field>
        <mat-label>Taille (cm)</mat-label>
        <input #heightInput #heightCtrl="ngModel" name="height" type="number" matInput placeholder="taille du patient"
               required [min]="heightBounds.min" [max]="heightBounds.max"
               [ngModel]="patient.heightCm" (change)="updateHeight($event)"
               (focus)="heightInput.select()" (keyup.enter)="weightInput.focus()">
        <mat-error *ngIf="heightCtrl.invalid">
          Taille attendue entre {{heightBounds.min}} et {{heightBounds.max}} cm
        </mat-error>
      </mat-form-field>
    </p>

    <p>
      <mat-form-field>
        <mat-label>Poids (kg)</mat-label>
        <input #weightInput #weightCtrl="ngModel" name="weight" type="number" step="0.1" matInput
               placeholder="poids du patient" required [min]="weightBounds.min" [max]="weightBounds.max"
               [ngModel]="patient.weightKg" (change)="updateWeight($event)"
               (focus)="weightInput.select()">
        <mat-error *ngIf="weightCtrl.invalid">
          Poids attendu entre {{weightBounds.min}} et {{weightBounds.max}} kg
        </mat-error>
      </mat-form-field>
    </p>

    <p *ngIf="shouldDisplayAdjustedWeight()">
      <mat-form-field>
        <mat-label>Poids ajusté (kg)</mat-label>
        <input matInput readonly
               [value]="patient.adjustedWeightKg.toFixed(1)">
        <mat-hint>
          références
          <app-biblio-links [references]="['espen-p52', 'ideal-body-weight-equation']"></app-biblio-links>
        </mat-hint>
      </mat-form-field>
    </p>

    <p>
      <mat-form-field>
        <mat-label>IMC</mat-label>
        <input matInput readonly
               [value]="patient.bmi.toFixed(1)">
      </mat-form-field>
    </p>

  </form>

</mat-expansion-panel>
