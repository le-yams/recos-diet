include:
  - project: 'to-be-continuous/angular'
    ref: '4.15.0'
    file: '/templates/gitlab-ci-angular.yml'
  - project: "to-be-continuous/semantic-release"
    ref: "4.3.0"
    file: '/templates/gitlab-ci-semrel.yml'
  - project: 'ydisanto/tbc-lftp'
    ref: '1.0.0'
    file: '/templates/gitlab-ci-lftp.yml'

# required: the tbc-lftp template declares its own stages, which would override the TBC ones
stages:
  - build
  - test
  - package-build
  - package-test
  - infra
  - deploy
  - acceptance
  - publish
  - infra-prod
  - production

variables:
  # Angular template
  NG_CLI_IMAGE: trion/ng-cli-karma:17.3.7
  # the template default ("build --no-progress") is also applied to the domain library, whose ng-packagr builder rejects it
  NG_BUILD_ARGS: "build"
  LFTP_SRC: "dist/web"

semantic-release:
  artifacts:
    name: "$CI_JOB_NAME artifacts from $CI_PROJECT_NAME on $CI_COMMIT_REF_SLUG"
    paths:
      - package.json
    expire_in: 1 day
  # template rules, except the manual release stays blocking (allow_failure: false): the template
  # makes it optional, which let build-for-prod be skipped and lftp-production deploy without a release
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - if: '$SEMREL_RELEASE_DISABLED == "true"'
      when: never
    - if: $CI_COMMIT_TAG
      when: never
    - if: '$CI_COMMIT_REF_NAME !~ $SEMREL_BRANCHES_REF'
      when: never
    - if: '$SEMREL_AUTO_RELEASE_ENABLED == "true"'
    - when: manual
      allow_failure: false

ng-build:
  before_script:
    - !reference [ .ng-cli-base, before_script ]
    - npm run "generate version asset"

build-for-prod:
  extends: ng-build
  stage: infra-prod
  needs:
    - semantic-release
  rules:
    - if: '$CI_COMMIT_REF_NAME =~ $PROD_REF'

# production only ever receives the release build, never the ng-build artifacts
lftp-production:
  needs:
    - build-for-prod
