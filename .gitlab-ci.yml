include:
  - project: 'to-be-continuous/angular'
    ref: '4.0.0'
    file: '/templates/gitlab-ci-angular.yml'
  - project: "to-be-continuous/semantic-release"
    ref: "2.0.1"
    file: '/templates/gitlab-ci-semrel.yml'
  - project: 'ydisanto/tbc-lftp'
    ref: '1.0.0'
    file: '/templates/gitlab-ci-lftp.yml'

stages:
  - build
  - test
  - package-build
  - package-test
  - infra
  - deploy
  - acceptance
  - publish
  - infra-prod
  - production


variables:
  # Angular template
  NG_CLI_IMAGE: trion/ng-cli-karma:14.2.4
#  NG_DEFAULT_PROJECT: "web"
  LFTP_SRC: "dist/web"

semantic-release:
  artifacts:
    name: "$CI_JOB_NAME artifacts from $CI_PROJECT_NAME on $CI_COMMIT_REF_SLUG"
    paths:
      - package.json
    expire_in: 1 day

ng-build:
  before_script:
    - !reference [ .ng-cli-base, before_script ]
    - npm run "generate version asset"

build-for-prod:
  extends: ng-build
  stage: infra-prod
  needs:
    - semantic-release
  rules:
    - if: '$CI_COMMIT_REF_NAME =~ $PROD_REF'
